<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配送トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /*EDITMODE-BEGIN*/
  /* Defaults are mirrored in JS below */
  /*EDITMODE-END*/

  :root {
    /* Paper / Ivory aesthetic — refined */
    --bg:       #EFEAE0;
    --bg-soft:  #E8E1D2;
    --paper:    #FBF8F0;
    --paper-2:  #F4EFE3;
    --ink:      #1A1713;
    --ink-2:    #322E27;
    --muted:    #6F6857;
    --muted-2:  #A8A18F;
    --line:     rgba(26,23,19,0.08);
    --line-2:   rgba(26,23,19,0.16);
    --line-3:   rgba(26,23,19,0.28);

    /* Accents */
    --indigo:        #243E66;   /* sumi-indigo */
    --indigo-mid:    #3E5C8B;
    --indigo-deep:   #15243F;
    --indigo-tint:   #E6EBF3;
    --matcha:        #3D5C46;   /* tea green */
    --matcha-tint:   #E7ECDF;
    --beni:          #9B3A3A;   /* deep red */
    --beni-tint:     #F1E1DE;
    --kincha:        #8A5B1F;   /* gold-brown */
    --kincha-tint:   #F2E6CF;
    --sumi-tint:     #E2DDCF;

    --r-sm: 4px;
    --r:    8px;
    --r-lg: 14px;
    --r-xl: 22px;

    --shadow-card: 0 1px 0 rgba(26,23,19,0.03), 0 1px 2px rgba(26,23,19,0.03);
    --shadow-pop:  0 10px 30px -10px rgba(27,24,20,0.25), 0 2px 6px rgba(27,24,20,0.06);

    --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-sans:  "Noto Sans JP", -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    --font-mono:  "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* Soft dark mode (manual via [data-theme="dark"]) */
  [data-theme="dark"] {
    --bg:       #15130F;
    --bg-soft:  #1B1813;
    --paper:    #1F1C16;
    --paper-2:  #25211A;
    --ink:      #F2EDE0;
    --ink-2:    #E0DACA;
    --muted:    #9B9482;
    --muted-2:  #6A6457;
    --line:     rgba(242,237,224,0.08);
    --line-2:   rgba(242,237,224,0.16);
    --line-3:   rgba(242,237,224,0.30);

    --indigo:        #8FAAD2;
    --indigo-mid:    #6E8AB6;
    --indigo-deep:   #C7D4E8;
    --indigo-tint:   #1E2A40;
    --matcha:        #B7CAA0;
    --matcha-tint:   #1F2A1F;
    --beni:          #E59999;
    --beni-tint:     #3A1F1F;
    --kincha:        #D9B07A;
    --kincha-tint:   #2D2316;
    --sumi-tint:     #2A2620;
  }

  /* Sumi (charcoal) palette */
  [data-palette="sumi"] {
    --indigo:      #2D2B27;
    --indigo-mid:  #4A463D;
    --indigo-deep: #161513;
    --indigo-tint: #E2DDD0;
  }
  [data-palette="sumi"][data-theme="dark"] {
    --indigo:      #D6CFBE;
    --indigo-mid:  #B5AE9C;
    --indigo-deep: #F2ECDD;
    --indigo-tint: #2A2620;
  }

  /* Beni (red lacquer) palette */
  [data-palette="beni"] {
    --indigo:      #913232;
    --indigo-mid:  #B85454;
    --indigo-deep: #5C1F1F;
    --indigo-tint: #F2E0DC;
  }
  [data-palette="beni"][data-theme="dark"] {
    --indigo:      #E8A6A6;
    --indigo-mid:  #C68080;
    --indigo-deep: #F4C9C9;
    --indigo-tint: #3A1F1F;
  }

  /* Matcha palette */
  [data-palette="matcha"] {
    --indigo:      #3D5C46;
    --indigo-mid:  #5A7D63;
    --indigo-deep: #21341E;
    --indigo-tint: #E7ECDF;
  }
  [data-palette="matcha"][data-theme="dark"] {
    --indigo:      #B7CAA0;
    --indigo-mid:  #95AB7E;
    --indigo-deep: #D6E1BF;
    --indigo-tint: #1F2A1F;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-feature-settings: "palt" 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.6;
    background-image:
      radial-gradient(rgba(26,23,19,0.022) 1px, transparent 1px),
      radial-gradient(rgba(26,23,19,0.014) 1px, transparent 1px);
    background-size: 42px 42px, 26px 26px;
    background-position: 0 0, 13px 17px;
  }
  [data-theme="dark"] body, body[data-theme="dark"] {
    background-image:
      radial-gradient(rgba(242,237,224,0.022) 1px, transparent 1px),
      radial-gradient(rgba(242,237,224,0.014) 1px, transparent 1px);
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: clamp(1.25rem, 2.5vw, 2.25rem) 1.25rem 5rem; }
  .hidden { display: none !important; }

  /* Typography */
  .serif { font-family: var(--font-serif); }
  .mono  { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
  .num   { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  h1, h2, h3, .display {
    font-family: var(--font-serif);
    font-weight: 400;
    letter-spacing: -0.005em;
  }
  h3 {
    font-size: 13px;
    font-weight: 500;
    margin: 0 0 1.25rem;
    color: var(--muted);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h3::before {
    content: "";
    width: 14px;
    height: 1px;
    background: var(--ink);
    display: inline-block;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted-2);
    font-weight: 500;
  }

  .ornament {
    text-align: center;
    color: var(--muted-2);
    font-size: 14px;
    letter-spacing: 0.5em;
    margin: 0.5rem 0 1.5rem;
    font-family: var(--font-serif);
    user-select: none;
  }

  /* Form controls */
  label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
  }
  input[type=text], input[type=number], input[type=date], textarea, select {
    width: 100%;
    padding: 11px 14px;
    font-size: 15px;
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=number] { font-variant-numeric: tabular-nums; }
  input:focus, textarea:focus, select:focus {
    border-color: var(--indigo);
    box-shadow: 0 0 0 3px var(--indigo-tint);
    background: var(--paper);
  }
  textarea { min-height: 70px; resize: vertical; line-height: 1.6; }

  select {
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 13px 16px;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
    border-radius: var(--r);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    cursor: pointer;
    font-family: inherit;
    transition: transform .08s, background .15s;
  }
  .btn-primary:hover { background: var(--ink-2); }
  .btn-primary:active { transform: translateY(1px); }

  .btn-sm {
    padding: 7px 14px;
    font-size: 12px;
    letter-spacing: 0.08em;
    border: 1px solid var(--line-2);
    background: var(--paper);
    color: var(--ink-2);
    border-radius: var(--r);
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: background .12s, border-color .12s;
  }
  .btn-sm:hover { background: var(--paper-2); border-color: var(--line-3); }

  .btn-ghost {
    padding: 7px 12px;
    font-size: 12px;
    letter-spacing: 0.06em;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
  }
  .btn-ghost:hover { color: var(--ink); }

  .btn-danger {
    padding: 9px 16px;
    font-size: 12px;
    letter-spacing: 0.1em;
    border: 1px solid rgba(155,58,58,0.35);
    background: transparent;
    color: var(--beni);
    border-radius: var(--r);
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
  }
  .btn-danger:hover { background: var(--beni-tint); }

  .err { font-size: 12px; color: var(--beni); margin: 8px 0 0; min-height: 18px; letter-spacing: 0.02em; }

  /* Cards */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 1.75rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-card);
  }

  /* Metric tiles — minimal */
  .metric {
    background: transparent;
    border: none;
    border-top: 1px solid var(--line-2);
    border-radius: 0;
    padding: 14px 0 10px;
    position: relative;
    overflow: hidden;
  }
  .metric.accent { border-top-color: var(--ink); }
  .metric-label {
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin: 0 0 8px;
    font-weight: 500;
  }
  .metric-value {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 300;
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1.05;
  }
  .metric.accent .metric-value { color: var(--ink); }
  .metric-unit {
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
    font-family: var(--font-sans);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    vertical-align: 3px;
  }

  /* Tags / Chips — restrained, mono with colored dot */
  .tag {
    font-size: 11px;
    padding: 2px 10px 2px 8px;
    border-radius: 99px;
    font-weight: 500;
    letter-spacing: 0.04em;
    border: 1px solid var(--line-2);
    background: transparent;
